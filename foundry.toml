# Foundry at the repo root: IMD's contract import looks for src/ here, and anyone can `forge test`.
# Contracts in src/, fork tests in test/, deploy script in script/, vendored forge-std in contracts/lib/.
[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["contracts/lib"]
remappings = ["forge-std/=contracts/lib/forge-std/src/"]
out = "contracts/out"
cache_path = "contracts/cache"
broadcast = "contracts/broadcast"
optimizer = true
optimizer_runs = 2000
solc_version = "0.8.26"
via_ir = true
bytecode_hash = "none"
