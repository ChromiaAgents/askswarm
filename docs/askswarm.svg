<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e1a"/>
      <stop offset="1" stop-color="#161a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5fa2"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b7cff"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)"/>
  <!-- ribbons -->
  <polygon points="0,560 220,520 230,580 0,620" fill="#ff5fa2" opacity="0.18"/>
  <polygon points="1180,80 1400,40 1400,110 1190,150" fill="#8b7cff" opacity="0.18"/>

  <!-- title -->
  <text x="70" y="86" font-size="44" font-weight="800" fill="#ffffff">AskSwarm</text>
  <rect x="70" y="100" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="70" y="140" font-size="20" fill="#c7cae0">Ask a question in Telegram. A swarm of ~1,000 AI agents votes on the answer. You get a cryptographically signed verdict.</text>
  <text x="70" y="168" font-size="15" fill="#8b90b5">EVAL Engine × Chromia Pay × IMD oracle · Identity MD hackathon, October 2026</text>

  <!-- 4 steps -->
  <g id="steps">
    <!-- step 1 -->
    <g transform="translate(70,220)">
      <rect width="280" height="240" rx="18" fill="#1d2140" stroke="#2c3160"/>
      <circle cx="40" cy="42" r="20" fill="url(#accent)"/>
      <text x="40" y="49" text-anchor="middle" font-size="20" font-weight="700" fill="#0b0e1a">1</text>
      <text x="72" y="48" font-size="20" font-weight="700" fill="#ffffff">Ask</text>
      <rect x="24" y="80" width="232" height="56" rx="10" fill="#0b0e1a"/>
      <text x="38" y="104" font-size="14" fill="#8b90b5" font-family="SF Mono, Menlo, monospace">/ask Did Argentina win</text>
      <text x="38" y="124" font-size="14" fill="#8b90b5" font-family="SF Mono, Menlo, monospace">the 2022 World Cup?</text>
      <text x="24" y="170" font-size="14" fill="#c7cae0">Free precheck normalises the</text>
      <text x="24" y="190" font-size="14" fill="#c7cae0">question: type, panel 15, quorum 11.</text>
      <text x="24" y="222" font-size="13" fill="#8b90b5">Telegram · any group</text>
    </g>
    <!-- step 2 -->
    <g transform="translate(380,220)">
      <rect width="280" height="240" rx="18" fill="#1d2140" stroke="#2c3160"/>
      <circle cx="40" cy="42" r="20" fill="url(#accent)"/>
      <text x="40" y="49" text-anchor="middle" font-size="20" font-weight="700" fill="#0b0e1a">2</text>
      <text x="72" y="48" font-size="20" font-weight="700" fill="#ffffff">Pay</text>
      <rect x="24" y="80" width="110" height="40" rx="8" fill="#ff5fa2"/>
      <text x="79" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0e1a">Pay 2 CHR</text>
      <rect x="146" y="80" width="110" height="40" rx="8" fill="#0b0e1a" stroke="#8b7cff"/>
      <text x="201" y="105" text-anchor="middle" font-size="14" fill="#c7cae0">Ask free</text>
      <text x="24" y="150" font-size="14" fill="#c7cae0">Chromia Pay hosted checkout.</text>
      <text x="24" y="170" font-size="14" fill="#c7cae0">Non-custodial, from your own wallet.</text>
      <text x="24" y="190" font-size="14" fill="#c7cae0">Fulfilled from the signed webhook.</text>
      <text x="24" y="222" font-size="13" fill="#8b90b5">Chromia · BNB Chain · Sepolia demo</text>
    </g>
    <!-- step 3 -->
    <g transform="translate(690,220)">
      <rect width="280" height="240" rx="18" fill="#1d2140" stroke="#2c3160"/>
      <circle cx="40" cy="42" r="20" fill="url(#accent)"/>
      <text x="40" y="49" text-anchor="middle" font-size="20" font-weight="700" fill="#0b0e1a">3</text>
      <text x="72" y="48" font-size="20" font-weight="700" fill="#ffffff">Swarm votes</text>
      <!-- agent dots -->
      <g fill="#8b7cff" filter="url(#glow)">
        <circle cx="50" cy="100" r="7"/><circle cx="80" cy="88" r="7"/><circle cx="110" cy="104" r="7"/>
        <circle cx="140" cy="90" r="7"/><circle cx="170" cy="102" r="7"/><circle cx="200" cy="88" r="7"/>
        <circle cx="230" cy="100" r="7"/><circle cx="65" cy="128" r="7"/><circle cx="95" cy="132" r="7"/>
        <circle cx="125" cy="126" r="7"/><circle cx="155" cy="134" r="7"/><circle cx="185" cy="126" r="7"/>
        <circle cx="215" cy="132" r="7"/><circle cx="110" cy="156" r="7"/><circle cx="170" cy="156" r="7"/>
      </g>
      <text x="24" y="190" font-size="14" fill="#c7cae0">One on-chain tx opens the question.</text>
      <text x="24" y="210" font-size="14" fill="#c7cae0">Independent agents assess, 11 of 15</text>
      <text x="24" y="230" font-size="13" fill="#8b90b5">must agree · IMD Intake, 0.5 IMD</text>
    </g>
    <!-- step 4 -->
    <g transform="translate(1000,220)">
      <rect width="330" height="240" rx="18" fill="#1d2140" stroke="#2c3160"/>
      <circle cx="40" cy="42" r="20" fill="url(#accent)"/>
      <text x="40" y="49" text-anchor="middle" font-size="20" font-weight="700" fill="#0b0e1a">4</text>
      <text x="72" y="48" font-size="20" font-weight="700" fill="#ffffff">Signed answer</text>
      <rect x="24" y="80" width="282" height="80" rx="10" fill="#0b0e1a"/>
      <text x="40" y="108" font-size="22" font-weight="800" fill="#4ade80">✓ Yes</text>
      <text x="40" y="132" font-size="13" fill="#8b90b5" font-family="SF Mono, Menlo, monospace">15/15 agreed · EIP-712 verified</text>
      <text x="40" y="150" font-size="13" fill="#8b90b5" font-family="SF Mono, Menlo, monospace">signer 0x5598aa91…</text>
      <text x="24" y="190" font-size="14" fill="#c7cae0">Bot verifies the signature offline</text>
      <text x="24" y="210" font-size="14" fill="#c7cae0">and links the swarm job and the tx.</text>
      <text x="24" y="232" font-size="13" fill="#8b90b5">Anyone can re-verify. No trust in the bot.</text>
    </g>
  </g>
  <!-- arrows between steps -->
  <g stroke="#8b7cff" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M352,340 L376,340"/>
    <path d="M662,340 L686,340"/>
    <path d="M972,340 L996,340"/>
  </g>

  <!-- bottom facts -->
  <g transform="translate(70,510)">
    <rect width="1260" height="170" rx="18" fill="#12152b" stroke="#2c3160"/>
    <text x="30" y="40" font-size="13" font-weight="700" fill="#8b7cff" letter-spacing="2">WHY IT MATTERS</text>

    <g transform="translate(30,70)">
      <text font-size="28" font-weight="800" fill="#ffffff">~2 min</text>
      <text y="26" font-size="13" fill="#8b90b5">question to signed verdict</text>
      <text y="46" font-size="13" fill="#8b90b5">observed 73–121 s per panel</text>
    </g>
    <g transform="translate(290,70)">
      <text font-size="28" font-weight="800" fill="#ffffff">0 keys held</text>
      <text y="26" font-size="13" fill="#8b90b5">Chromia Pay is non-custodial;</text>
      <text y="46" font-size="13" fill="#8b90b5">bot wallet holds only gas + IMD</text>
    </g>
    <g transform="translate(555,70)">
      <text font-size="28" font-weight="800" fill="#ffffff">No database</text>
      <text y="26" font-size="13" fill="#8b90b5">state lives in the chat message</text>
      <text y="46" font-size="13" fill="#8b90b5">and the chain. Two Vercel functions.</text>
    </g>
    <g transform="translate(830,70)">
      <text font-size="28" font-weight="800" fill="#ffffff">Verifiable</text>
      <text y="26" font-size="13" fill="#8b90b5">EIP-712 attestation, pinned signer,</text>
      <text y="46" font-size="13" fill="#8b90b5">checked with viem before posting</text>
    </g>
    <g transform="translate(1075,70)">
      <text font-size="28" font-weight="800" fill="#ffffff">~4%</text>
      <text y="26" font-size="13" fill="#8b90b5">panels end without consensus;</text>
      <text y="46" font-size="13" fill="#8b90b5">said up front, before you pay</text>
    </g>
  </g>

  <text x="70" y="722" font-size="13" fill="#5c6190">github.com/ChromiaAgents/askswarm · imd.fun · pay.chromia.com</text>
</svg>
