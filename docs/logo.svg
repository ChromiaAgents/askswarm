<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Chromia brand: candy purple tile, warm off-white sticker with ink stroke and a hard shadow in the purple-800 twin. No gradients. -->
  <rect width="512" height="512" rx="120" fill="#CC91F0"/>
  <!-- shadow twin -->
  <path transform="translate(14 14)" d="M116 118h280a40 40 0 0 1 40 40v168a40 40 0 0 1-40 40H236l-72 64v-64h-48a40 40 0 0 1-40-40V158a40 40 0 0 1 40-40z" fill="#9E5ECF"/>
  <!-- speech bubble = the question -->
  <path d="M116 118h280a40 40 0 0 1 40 40v168a40 40 0 0 1-40 40H236l-72 64v-64h-48a40 40 0 0 1-40-40V158a40 40 0 0 1 40-40z" fill="#FFF8F8" stroke="#1F1A23" stroke-width="8"/>
  <!-- swarm = agents voting, connected -->
  <g stroke="#1F1A23" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M186 212L256 192L326 212M186 212L221 272L291 272L326 212M256 192L221 272M256 192L291 272"/>
  </g>
  <g fill="#1F1A23">
    <circle cx="186" cy="212" r="19"/><circle cx="256" cy="192" r="19"/><circle cx="326" cy="212" r="19"/>
    <circle cx="221" cy="272" r="19"/><circle cx="291" cy="272" r="19"/>
  </g>
  <!-- verified: green sticker with ink stroke, shadow twin -->
  <circle cx="404" cy="378" r="60" fill="#4FCD4C" transform="translate(8 8)"/>
  <circle cx="404" cy="378" r="60" fill="#93F091" stroke="#1F1A23" stroke-width="8"/>
  <path d="M376 380l18 18 38-42" stroke="#1F1A23" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
